name: tests

on:
  push:
  pull_request:

jobs:
  # assembler, emulator, runtime, serial driver, tools: no simulator needed
  fast:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install numpy pytest
      - run: python -m pytest -m "not rtl" -q

  # Verilog scenarios, UART faults, and ULX3S and Basys 3 board startup/reset/inference.
  # Each test simulates millions of clock cycles, and the whole suite takes
  # hours on a hosted runner, so it runs as parallel jobs. Within a file the
  # selections complement each other (-k X / -k "not X"), and the last job
  # takes every file the others do not name: together they run every test in
  # tests/rtl, including ones added later.
  rtl:
    name: rtl (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: scenarios, default build
            tests: tests/rtl/test_rtl.py -k default
            minutes: 30
          - name: scenarios, other builds
            tests: tests/rtl/test_rtl.py -k "not default"
            minutes: 20
          - name: serial link
            tests: tests/rtl/test_serial_rtl.py
            minutes: 20
          - name: ULX3S, physical baud
            tests: tests/rtl/test_ulx3s.py -k physical_baud
            minutes: 45
          - name: ULX3S, full network
            tests: tests/rtl/test_ulx3s.py -k "not physical_baud"
            minutes: 60
          - name: Basys 3 wrapper
            tests: tests/rtl/test_basys3.py
            minutes: 60
          - name: board benchmark and other files
            tests: >-
              tests/rtl --ignore=tests/rtl/test_rtl.py --ignore=tests/rtl/test_serial_rtl.py
              --ignore=tests/rtl/test_ulx3s.py --ignore=tests/rtl/test_basys3.py
            minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python -m pip install numpy pytest cocotb
      - run: python -m pytest ${{ matrix.tests }} -v --durations=0
