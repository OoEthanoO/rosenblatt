name: tests

on:
  push:
  pull_request:

jobs:
  # assembler, emulator, runtime, serial driver, tools: no simulator needed
  fast:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install numpy pytest
      - run: python -m pytest -m "not rtl" -q

  # Verilog scenarios, UART faults, and ULX3S board startup/reset/inference.
  rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python -m pip install numpy pytest cocotb
      - run: python -m pytest tests/rtl -q
